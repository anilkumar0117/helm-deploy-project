apiVersion: v1
kind: Service

metadata:
  name: {{ include "animeworld.fullname" . }}
  labels:
    {{- include "animeworld.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "animeworld.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
